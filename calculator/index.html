<!DOCTYPE html>
<html>
    <head>
        <title>calculator</title>
        <link rel="stylesheet" href="main.css">
    </head>

    <body>
        
        <div class="calculator">
            <div class="screen"></div>
            <div class="buttons">
                <div class="key key-dark">MC</div>
                <div class="key key-dark">M+</div>
                <div class="key key-dark">/</div>
                <div class="key key-dark">*</div>
                <div class="key">7</div>
                <div class="key">8</div>
                <div class="key">9</div>
                <div class="key">-</div>
                <div class="key">4</div>
                <div class="key">5</div>
                <div class="key">6</div>
                <div class="key">+</div>
                <div class="key">1</div>
                <div class="key">2</div>
                <div class="key">3</div>
                <div class="key equal">=</div>
                <div class="key zero">0</div>
                <div class="key">.</div>
            </div>
        </div>
    </body>
</html>
